<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>一人公司 AI 数字员工工作台</title>
    <style>
      :root {
        --ink: #17201d;
        --moss: #41564b;
        --mint: #c7ded2;
        --paper: #f4f7f2;
        --panel: #fbfcf8;
        --line: #d7ded2;
        --amber: #d99238;
        --clay: #b86b4b;
        --soft: 0 18px 50px rgba(23, 32, 29, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        color: var(--ink);
        background: var(--paper);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      }

      button,
      input,
      textarea,
      select {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      .app {
        min-height: 100vh;
      }

      .sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        width: 280px;
        padding: 20px 16px;
        border-right: 1px solid var(--line);
        background: var(--panel);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px;
      }

      .brand-logo {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 112px;
        height: 48px;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        padding: 6px;
      }

      .brand-logo img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .brand strong,
      .brand span {
        display: block;
      }

      .brand span {
        margin-top: 2px;
        color: var(--moss);
        font-size: 12px;
      }

      .nav {
        display: grid;
        gap: 6px;
        margin-top: 28px;
      }

      .nav button {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        border: 0;
        border-radius: 8px;
        padding: 11px 12px;
        color: var(--moss);
        background: transparent;
        text-align: left;
        font-size: 14px;
        font-weight: 700;
      }

      .nav button.active {
        color: var(--ink);
        background: var(--mint);
      }

      .main {
        padding-left: 280px;
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 5;
        display: flex;
        justify-content: space-between;
        gap: 18px;
        min-height: 72px;
        padding: 14px 32px;
        border-bottom: 1px solid var(--line);
        background: rgba(244, 247, 242, 0.92);
        backdrop-filter: blur(14px);
      }

      .topbar p,
      .page-header p,
      .muted {
        color: var(--moss);
      }

      .topbar p,
      .topbar h1 {
        margin: 0;
      }

      .topbar p {
        font-size: 12px;
        font-weight: 800;
        text-transform: uppercase;
      }

      .topbar h1 {
        margin-top: 4px;
        font-size: 18px;
      }

      .status-pill,
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border-radius: 7px;
        padding: 8px 10px;
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--moss);
        font-size: 13px;
        font-weight: 700;
        white-space: nowrap;
      }

      .content {
        padding: 28px 32px 42px;
      }

      .page-header {
        display: flex;
        justify-content: space-between;
        align-items: end;
        gap: 20px;
        margin-bottom: 24px;
      }

      .page-header p,
      .page-header h2 {
        margin: 0;
      }

      .eyebrow {
        color: var(--clay);
        font-size: 12px;
        font-weight: 900;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .page-header h2 {
        margin-top: 8px;
        font-size: 30px;
      }

      .page-header .muted {
        max-width: 760px;
        margin-top: 8px;
        font-size: 14px;
        line-height: 1.7;
      }

      .grid {
        display: grid;
        gap: 18px;
      }

      .metrics {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .two {
        grid-template-columns: 1fr 1fr;
      }

      .wide {
        grid-template-columns: 0.9fr 1.1fr;
      }

      .panel,
      .card {
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--panel);
        box-shadow: var(--soft);
      }

      .panel {
        padding: 20px;
      }

      .card {
        padding: 16px;
      }

      .panel-title {
        margin: 0;
        font-size: 17px;
      }

      .panel-desc {
        margin: 6px 0 16px;
        color: var(--moss);
        font-size: 14px;
        line-height: 1.65;
      }

      .metric {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 16px;
        background: var(--panel);
      }

      .metric span {
        color: var(--moss);
        font-size: 12px;
        font-weight: 800;
      }

      .metric strong {
        display: block;
        margin-top: 8px;
        font-size: 28px;
      }

      .metric p {
        margin: 10px 0 0;
        color: var(--moss);
        font-size: 12px;
        line-height: 1.6;
      }

      .list {
        display: grid;
        gap: 10px;
      }

      .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 14px;
        padding: 12px 0;
        border-bottom: 1px solid var(--line);
      }

      .row:last-child {
        border-bottom: 0;
      }

      .row strong,
      .row p {
        margin: 0;
      }

      .row p {
        margin-top: 4px;
        color: var(--moss);
        font-size: 13px;
      }

      .badge {
        border: 0;
        padding: 5px 8px;
        font-size: 12px;
      }

      .online,
      .approved,
      .low,
      .done {
        background: var(--mint);
        color: var(--ink);
      }

      .busy,
      .pending,
      .high,
      .urgent {
        background: rgba(217, 146, 56, 0.18);
        color: #7a4814;
      }

      .critical,
      .blocked,
      .rejected {
        background: rgba(184, 107, 75, 0.18);
        color: #7a2f1f;
      }

      .idle,
      .medium,
      .todo,
      .not_required,
      .in_progress {
        background: #e8efe4;
        color: var(--moss);
      }

      .progress {
        height: 9px;
        overflow: hidden;
        border-radius: 999px;
        background: #dfe8dc;
      }

      .progress span {
        display: block;
        height: 100%;
        border-radius: inherit;
        background: var(--moss);
      }

      .stack {
        display: grid;
        gap: 16px;
      }

      .form {
        display: grid;
        gap: 14px;
      }

      .form.two-col {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .full {
        grid-column: 1 / -1;
      }

      label span {
        display: block;
        margin-bottom: 7px;
        font-size: 13px;
        font-weight: 800;
      }

      input,
      textarea,
      select {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px 12px;
        outline: none;
        background: var(--paper);
        color: var(--ink);
        font-size: 14px;
      }

      textarea {
        min-height: 112px;
        resize: vertical;
        line-height: 1.6;
      }

      input:focus,
      textarea:focus,
      select:focus {
        border-color: var(--moss);
      }

      .btns {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .btn {
        border: 0;
        border-radius: 8px;
        padding: 10px 14px;
        background: var(--ink);
        color: var(--paper);
        font-size: 14px;
        font-weight: 800;
      }

      .btn.secondary {
        border: 1px solid var(--line);
        background: transparent;
        color: var(--moss);
      }

      .btn.moss {
        background: var(--moss);
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .chip {
        border-radius: 7px;
        padding: 6px 8px;
        background: #e8efe4;
        color: var(--moss);
        font-size: 12px;
        font-weight: 800;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 760px;
      }

      th {
        padding: 0 12px 12px 0;
        border-bottom: 1px solid var(--line);
        color: var(--moss);
        font-size: 12px;
        text-align: left;
        text-transform: uppercase;
      }

      td {
        padding: 14px 12px 14px 0;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
        font-size: 14px;
      }

      td p {
        margin: 5px 0 0;
        color: var(--moss);
        line-height: 1.55;
      }

      .table-wrap {
        overflow-x: auto;
      }

      .hidden {
        display: none;
      }

      .mobile-nav {
        display: none;
      }

      @media (max-width: 1120px) {
        .metrics,
        .two,
        .wide {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 860px) {
        .sidebar {
          display: none;
        }

        .main {
          padding-left: 0;
        }

        .topbar {
          padding: 14px 18px;
        }

        .mobile-nav {
          display: flex;
          gap: 8px;
          overflow-x: auto;
          padding: 10px 18px;
          border-bottom: 1px solid var(--line);
          background: var(--paper);
        }

        .mobile-nav button {
          flex: 0 0 auto;
          border: 1px solid var(--line);
          border-radius: 8px;
          padding: 8px 10px;
          background: var(--panel);
          color: var(--moss);
          font-size: 12px;
          font-weight: 800;
        }

        .mobile-nav button.active {
          background: var(--mint);
          color: var(--ink);
        }

        .content {
          padding: 22px 18px 34px;
        }

        .page-header {
          align-items: stretch;
          flex-direction: column;
        }

        .page-header h2 {
          font-size: 25px;
        }

        .form.two-col {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-logo"><img src="./zlink-logo.jpg" alt="ZLink" /></div>
          <div>
            <strong>ZLink AI</strong>
            <span>数字员工工作台</span>
          </div>
        </div>
        <nav class="nav" id="sideNav"></nav>
      </aside>

      <main class="main">
        <header class="topbar">
          <div>
            <p>Owner Console</p>
            <h1>ZLink AI 数字员工工作台</h1>
          </div>
          <div class="status-pill" id="globalStatus">本地 MVP 已启动</div>
        </header>
        <nav class="mobile-nav" id="mobileNav"></nav>
        <div class="content" id="view"></div>
      </main>
    </div>

    <script>
      const storageKey = "oneco-ai-workbench-v1";
      const today = new Date().toISOString().slice(0, 10);
      const nav = [
        ["dashboard", "Dashboard"],
        ["agents", "Agents"],
        ["projects", "Projects"],
        ["tasks", "Tasks"],
        ["command", "Command Center"],
        ["meeting", "Meeting Room"],
        ["memory", "Memory"]
      ];

      const seed = {
        agents: [
          {
            id: "agent-exec",
            name: "林澈",
            department: "Executive",
            title: "执行经理 Agent",
            managerId: "",
            model: "gpt-4o",
            prompt: "负责目标拆解、任务编排、风险识别和会议主持。",
            tools: ["openai", "supabase", "n8n", "email"],
            status: "online",
            currentFocus: "拆解老板今日增长目标",
            successRate: 94
          },
          {
            id: "agent-market",
            name: "岑远",
            department: "Marketing",
            title: "增长营销 Agent",
            managerId: "agent-exec",
            model: "gpt-4o-mini",
            prompt: "负责用户洞察、渠道策略、内容日历和广告创意。",
            tools: ["openai", "browser", "n8n"],
            status: "busy",
            currentFocus: "设计获客内容矩阵",
            successRate: 88
          },
          {
            id: "agent-ops",
            name: "许栖",
            department: "Operations",
            title: "运营交付 Agent",
            managerId: "agent-exec",
            model: "gpt-4o-mini",
            prompt: "负责 SOP、项目推进、客户交付和复盘。",
            tools: ["openai", "supabase", "email"],
            status: "online",
            currentFocus: "整理客户交付 SOP",
            successRate: 91
          },
          {
            id: "agent-finance",
            name: "周砚",
            department: "Finance",
            title: "财务风控 Agent",
            managerId: "agent-exec",
            model: "gpt-4o-mini",
            prompt: "负责预算、现金流、合同风险和高风险任务审查。",
            tools: ["openai", "supabase"],
            status: "idle",
            currentFocus: "等待审批任务",
            successRate: 86
          }
        ],
        projects: [
          {
            id: "project-aurora",
            name: "Aurora 咨询交付",
            clientName: "Aurora Studio",
            objective: "30 天内完成 AI 工作流诊断、SOP 重建与自动化上线。",
            clientProfile: "创意服务公司，团队 12 人，主要痛点是交付不稳定、销售线索沉淀不足。",
            progress: 62,
            stage: "自动化搭建",
            agentIds: ["agent-exec", "agent-ops", "agent-market"],
            dueDate: "2026-06-28"
          },
          {
            id: "project-solo",
            name: "个人品牌增长系统",
            clientName: "内部项目",
            objective: "建立可复用的内容生产、私域转化和日报复盘系统。",
            clientProfile: "一人公司自营增长项目，目标是降低老板日常运营负担。",
            progress: 38,
            stage: "策略验证",
            agentIds: ["agent-exec", "agent-market", "agent-finance"],
            dueDate: "2026-07-12"
          }
        ],
        tasks: [
          {
            id: "task-001",
            title: "拆解 Aurora 自动化上线计划",
            description: "将客户现有交付流程拆为 n8n 自动化节点、负责人和验收标准。",
            projectId: "project-aurora",
            assignedAgentId: "agent-exec",
            priority: "urgent",
            riskLevel: "high",
            dueAt: "2026-06-10T18:00",
            status: "in_progress",
            approvalStatus: "pending",
            outputs: [
              {
                agentId: "agent-exec",
                content: "已识别 4 条关键链路：线索进入、需求澄清、交付排期、日报通知。",
                createdAt: "2026-06-09T09:30:00"
              }
            ]
          },
          {
            id: "task-002",
            title: "生成本周内容选题池",
            description: "围绕一人公司 AI 员工主题生成 20 个短内容选题。",
            projectId: "project-solo",
            assignedAgentId: "agent-market",
            priority: "high",
            riskLevel: "medium",
            dueAt: "2026-06-11T12:00",
            status: "todo",
            approvalStatus: "not_required",
            outputs: []
          },
          {
            id: "task-003",
            title: "复核客户合同付款节点",
            description: "检查 Aurora 合同付款、延期、变更范围条款。",
            projectId: "project-aurora",
            assignedAgentId: "agent-finance",
            priority: "medium",
            riskLevel: "critical",
            dueAt: "2026-06-12T17:00",
            status: "blocked",
            approvalStatus: "pending",
            outputs: []
          }
        ],
        memories: [
          {
            id: "memory-001",
            title: "高风险任务审批规则",
            type: "sop",
            content: "risk_level 为 high 或 critical 的任务必须创建 approvals 记录，并等待老板审批后再执行外部动作。",
            tags: ["approval", "risk", "sop"],
            relatedClient: "",
            updatedAt: "2026-06-09T08:00:00"
          },
          {
            id: "memory-002",
            title: "Aurora Studio 客户档案",
            type: "customer",
            content: "客户重视交付透明度和每周成果展示，沟通偏好是简短结论加明确待办。",
            tags: ["client", "aurora"],
            relatedClient: "Aurora Studio",
            updatedAt: "2026-06-08T16:00:00"
          }
        ],
        meetings: [],
        report: {
          id: "report-" + today,
          reportDate: today,
          summary: "今日重点推进 Aurora 自动化交付和个人品牌增长系统。高风险事项集中在合同条款与上线范围控制。",
          wins: ["完成 4 条核心自动化链路梳理", "新增 20 个内容选题候选方向", "识别 2 个需要老板审批的风险任务"],
          risks: ["Aurora 合同变更范围尚未确认", "执行经理 Agent 今日负载偏高"],
          nextActions: ["审批高风险任务", "确认 n8n Webhook 节点", "启动会议室复盘"]
        }
      };

      let state = load();
      let currentView = "dashboard";

      function load() {
        try {
          return JSON.parse(localStorage.getItem(storageKey)) || structuredClone(seed);
        } catch {
          return structuredClone(seed);
        }
      }

      function save() {
        localStorage.setItem(storageKey, JSON.stringify(state));
      }

      function id(prefix) {
        return prefix + "-" + Math.random().toString(16).slice(2, 10);
      }

      function esc(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function badge(value, label) {
        return `<span class="badge ${esc(value)}">${esc(label || value)}</span>`;
      }

      function agentName(agentId) {
        return state.agents.find((agent) => agent.id === agentId)?.name || "未分配";
      }

      function projectName(projectId) {
        return state.projects.find((project) => project.id === projectId)?.name || "无项目";
      }

      function setStatus(text) {
        document.getElementById("globalStatus").textContent = text;
      }

      function renderNav() {
        const html = nav
          .map(([key, label]) => `<button class="${key === currentView ? "active" : ""}" data-view="${key}">${label}</button>`)
          .join("");
        document.getElementById("sideNav").innerHTML = html;
        document.getElementById("mobileNav").innerHTML = html;
        document.querySelectorAll("[data-view]").forEach((button) => {
          button.addEventListener("click", () => {
            currentView = button.dataset.view;
            render();
          });
        });
      }

      function pageHeader(eyebrow, title, desc, action = "") {
        return `
          <section class="page-header">
            <div>
              <p class="eyebrow">${eyebrow}</p>
              <h2>${title}</h2>
              <p class="muted">${desc}</p>
            </div>
            ${action}
          </section>
        `;
      }

      function render() {
        renderNav();
        const view = document.getElementById("view");
        const views = {
          dashboard: renderDashboard,
          agents: renderAgents,
          projects: renderProjects,
          tasks: renderTasks,
          command: renderCommand,
          meeting: renderMeeting,
          memory: renderMemory
        };
        view.innerHTML = views[currentView]();
        bindView();
      }

      function renderDashboard() {
        const pending = state.tasks.filter((task) => task.approvalStatus === "pending");
        const risks = state.tasks.filter((task) => ["high", "critical"].includes(task.riskLevel));
        const avg = state.projects.length ? Math.round(state.projects.reduce((sum, project) => sum + Number(project.progress), 0) / state.projects.length) : 0;
        return `
          ${pageHeader("Dashboard", "今日经营驾驶舱", "日报、审批、任务进度、员工负载和风险集中在一页。", '<button class="btn" id="generateReport">生成今日日报</button>')}
          <section class="grid metrics">
            ${metric("待审批事项", pending.length, "高风险任务会自动进入老板审批队列。")}
            ${metric("进行中任务", state.tasks.filter((task) => task.status === "in_progress").length, "执行经理会持续追踪阻塞点。")}
            ${metric("项目平均进度", avg + "%", "来自所有客户项目的综合进展。")}
            ${metric("风险提醒", risks.length, "包含 high 与 critical 风险等级。")}
          </section>
          <section class="grid two" style="margin-top:18px">
            <div class="panel">
              <h3 class="panel-title">今日日报 · ${esc(state.report.reportDate)}</h3>
              <p class="panel-desc">${esc(state.report.summary)}</p>
              <div class="grid metrics">
                ${reportColumn("完成", state.report.wins)}
                ${reportColumn("风险", state.report.risks)}
                ${reportColumn("下一步", state.report.nextActions)}
              </div>
            </div>
            <div class="panel">
              <h3 class="panel-title">员工状态</h3>
              <p class="panel-desc">按当前工作焦点查看负载。</p>
              ${state.agents
                .map(
                  (agent) => `
                <div class="row">
                  <div><strong>${esc(agent.name)}</strong><p>${esc(agent.currentFocus || agent.title)}</p></div>
                  ${badge(agent.status)}
                </div>`
                )
                .join("")}
            </div>
          </section>
          <section class="grid wide" style="margin-top:18px">
            <div class="panel">
              <h3 class="panel-title">任务进度</h3>
              <p class="panel-desc">项目级进度，用于判断是否需要重新分配 Agent。</p>
              <div class="stack">${state.projects
                .map(
                  (project) => `
                <div>
                  <div class="row" style="border:0;padding:0 0 8px"><strong>${esc(project.name)}</strong><strong>${Number(project.progress)}%</strong></div>
                  <div class="progress"><span style="width:${Number(project.progress)}%"></span></div>
                </div>`
                )
                .join("")}</div>
            </div>
            <div class="panel">
              <h3 class="panel-title">待审批与风险任务</h3>
              <p class="panel-desc">高风险任务必须先过老板审批，再触发外部工具或客户动作。</p>
              <div class="stack">${pending
                .map(
                  (task) => `
                <div class="card">
                  <div class="row" style="padding:0;border:0">
                    <div><strong>${esc(task.title)}</strong><p>风险等级：${esc(task.riskLevel)}</p></div>
                    <div class="btns">
                      <button class="btn moss approve" data-id="${esc(task.id)}">批准</button>
                      <button class="btn secondary reject" data-id="${esc(task.id)}">拒绝</button>
                    </div>
                  </div>
                </div>`
                )
                .join("") || '<p class="muted">暂无待审批任务。</p>'}</div>
            </div>
          </section>
        `;
      }

      function metric(label, value, desc) {
        return `<div class="metric"><span>${label}</span><strong>${value}</strong><p>${desc}</p></div>`;
      }

      function reportColumn(title, items) {
        return `<div><strong>${title}</strong><div class="list" style="margin-top:10px">${items.map((item) => `<p class="muted" style="margin:0">• ${esc(item)}</p>`).join("")}</div></div>`;
      }

      function renderAgents() {
        return `
          ${pageHeader("Agents", "员工中心", "创建和编辑数字员工，定义岗位、模型、提示词、工具权限和当前状态。")}
          <section class="grid wide">
            <div class="panel">
              <h3 class="panel-title">Agent 配置</h3>
              <p class="panel-desc">保存后会进入浏览器本地数据，也可对照 Next.js 版本接入 Supabase。</p>
              <form class="form two-col" id="agentForm">
                ${input("name", "名称", "例如：林澈")}
                ${input("department", "部门", "Executive / Marketing")}
                ${input("title", "职位", "执行经理 Agent")}
                ${input("model", "模型", "gpt-4o-mini", "gpt-4o-mini")}
                ${input("status", "当前状态", "online / busy / idle", "idle")}
                ${input("tools", "工具权限", "openai, supabase, n8n", "openai, supabase")}
                <label class="full"><span>系统提示词</span><textarea name="prompt" required placeholder="定义职责、边界、输出格式和审批规则。"></textarea></label>
                <button class="btn moss">保存 Agent</button>
              </form>
            </div>
            <div class="grid two">${state.agents.map(agentCard).join("")}</div>
          </section>
        `;
      }

      function agentCard(agent) {
        return `
          <article class="card">
            <div class="row" style="padding:0;border:0">
              <div><strong>${esc(agent.name)}</strong><p>${esc(agent.title)}</p></div>
              ${badge(agent.status)}
            </div>
            <p class="muted">部门：${esc(agent.department)}</p>
            <p class="muted">模型：${esc(agent.model)} · 成功率：${Number(agent.successRate || 0)}%</p>
            <p class="muted">焦点：${esc(agent.currentFocus || "待分配")}</p>
            <div class="chips">${agent.tools.map((tool) => `<span class="chip">${esc(tool)}</span>`).join("")}</div>
          </article>
        `;
      }

      function renderProjects() {
        return `
          ${pageHeader("Projects", "项目中心", "创建客户项目，记录目标、客户资料、项目进度和参与 Agent。")}
          <section class="grid wide">
            <div class="panel">
              <h3 class="panel-title">客户项目表单</h3>
              <p class="panel-desc">项目保存后会立刻进入右侧列表。</p>
              <form class="form" id="projectForm">
                ${input("name", "项目名称", "Aurora 咨询交付")}
                ${input("clientName", "客户名称", "Aurora Studio")}
                <label><span>项目目标</span><textarea name="objective" required></textarea></label>
                <label><span>客户资料</span><textarea name="clientProfile"></textarea></label>
                <div class="grid metrics">
                  ${input("stage", "阶段", "planning", "planning")}
                  ${input("progress", "进度 %", "0", "0", "number")}
                  ${input("dueDate", "截止日期", "", "", "date")}
                </div>
                <button class="btn moss">保存项目</button>
              </form>
            </div>
            <div class="stack">${state.projects.map(projectCard).join("")}</div>
          </section>
        `;
      }

      function projectCard(project) {
        return `
          <article class="panel">
            <div class="row" style="padding:0;border:0">
              <div><strong>${esc(project.name)}</strong><p>${esc(project.clientName)} · ${esc(project.stage)}</p></div>
              ${project.dueDate ? `<span class="chip">Due ${esc(project.dueDate)}</span>` : ""}
            </div>
            <p class="muted">${esc(project.objective)}</p>
            <p class="muted">${esc(project.clientProfile)}</p>
            <div class="progress"><span style="width:${Number(project.progress)}%"></span></div>
            <div class="chips" style="margin-top:14px">${project.agentIds.map((agentId) => `<span class="chip">${esc(agentName(agentId))}</span>`).join("")}</div>
          </article>
        `;
      }

      function renderTasks() {
        const selectedId = state.selectedTaskId || state.tasks[0]?.id || "";
        const selectedTask = state.tasks.find((task) => task.id === selectedId) || state.tasks[0];
        return `
          ${pageHeader("Tasks", "任务中心", "创建任务、分配给 Agent、设置风险等级、审批状态，并沉淀 Agent 输出。")}
          <section class="grid wide">
            <div class="panel">
              <h3 class="panel-title">任务创建</h3>
              <p class="panel-desc">风险为 high 或 critical 时，会自动进入老板审批。</p>
              <form class="form" id="taskForm">
                ${input("title", "任务标题", "拆解客户交付计划")}
                <label><span>任务描述</span><textarea name="description" required></textarea></label>
                <div class="grid two">
                  ${select("assignedAgentId", "选择 Agent", state.agents.map((a) => [a.id, a.name]))}
                  ${select("projectId", "选择项目", state.projects.map((p) => [p.id, p.name]))}
                  ${select("priority", "优先级", [["low", "low"], ["medium", "medium"], ["high", "high"], ["urgent", "urgent"]])}
                  ${select("riskLevel", "风险等级", [["low", "low"], ["medium", "medium"], ["high", "high"], ["critical", "critical"]])}
                  ${input("dueAt", "截止时间", "", "", "datetime-local")}
                </div>
                <button class="btn moss">保存任务</button>
              </form>
            </div>
            <div class="panel">
              <h3 class="panel-title">任务输出记录</h3>
              <p class="panel-desc">所有 Agent 输出都会追加到任务记录。</p>
              ${selectedTask ? outputPanel(selectedTask) : '<p class="muted">暂无任务。</p>'}
            </div>
          </section>
          <section class="panel" style="margin-top:18px">
            <h3 class="panel-title">任务列表</h3>
            <div class="table-wrap">${taskTable(state.tasks)}</div>
          </section>
        `;
      }

      function outputPanel(task) {
        return `
          <form class="form" id="outputForm">
            ${select("taskId", "选择任务", state.tasks.map((t) => [t.id, t.title]), task.id)}
            ${select("agentId", "输出 Agent", state.agents.map((a) => [a.id, a.name]))}
            <label><span>输出内容</span><textarea name="content" required placeholder="写入 Agent 本轮输出、分析结论或执行结果"></textarea></label>
            <button class="btn">追加输出</button>
          </form>
          <div class="stack" style="margin-top:16px">${task.outputs
            .map(
              (output) => `
            <div class="card" style="box-shadow:none">
              <strong>${esc(agentName(output.agentId))} · ${esc(output.createdAt.slice(0, 16))}</strong>
              <p class="muted">${esc(output.content)}</p>
            </div>`
            )
            .join("") || '<p class="muted">暂无输出记录。</p>'}</div>
        `;
      }

      function taskTable(tasks) {
        return `
          <table>
            <thead><tr><th>任务</th><th>负责人</th><th>项目</th><th>风险</th><th>审批</th><th>状态</th></tr></thead>
            <tbody>${tasks
              .map(
                (task) => `
              <tr>
                <td><strong>${esc(task.title)}</strong><p>${esc(task.description)}</p></td>
                <td>${esc(agentName(task.assignedAgentId))}</td>
                <td>${esc(projectName(task.projectId))}</td>
                <td>${badge(task.riskLevel)}</td>
                <td>${badge(task.approvalStatus)}</td>
                <td>${badge(task.status)}</td>
              </tr>`
              )
              .join("")}</tbody>
          </table>
        `;
      }

      function renderCommand() {
        return `
          ${pageHeader("Command Center", "老板指挥台", "输入目标后，由执行经理 Agent 拆解任务、评估风险、分配岗位，并写入 Tasks。")}
          <section class="grid two">
            <div class="panel">
              <h3 class="panel-title">输入经营命令</h3>
              <p class="panel-desc">主持人：林澈 · 高风险任务会进入审批。</p>
              <form class="form" id="commandForm">
                <label><span>老板目标</span><textarea name="goal" required placeholder="例如：本周把 Aurora 项目的自动化交付流程上线，并产出一个可复用案例。"></textarea></label>
                <div class="btns">
                  <button class="btn">提交给执行经理</button>
                  <button type="button" class="btn secondary" id="fakeN8n">触发 n8n Webhook</button>
                </div>
              </form>
            </div>
            <div class="panel">
              <h3 class="panel-title">最近拆解结果</h3>
              <div class="stack">${state.tasks.slice(0, 4).map(commandTask).join("")}</div>
            </div>
          </section>
        `;
      }

      function commandTask(task) {
        return `
          <div class="card" style="box-shadow:none">
            <div class="row" style="border:0;padding:0">
              <strong>${esc(task.title)}</strong>
              ${badge(task.riskLevel)}
            </div>
            <p class="muted">${esc(task.description)}</p>
            <div class="chips"><span class="chip">${esc(agentName(task.assignedAgentId))}</span><span class="chip">${esc(task.approvalStatus)}</span></div>
          </div>
        `;
      }

      function renderMeeting() {
        const latest = state.meetings[0];
        return `
          ${pageHeader("Meeting Room", "AI 会议室", "选择多个 Agent 围绕一个主题讨论，由执行经理主持，最后生成会议纪要和待办任务。")}
          <section class="grid wide">
            <div class="panel">
              <h3 class="panel-title">会议配置</h3>
              <form class="form" id="meetingForm">
                ${input("topic", "会议主题", "Aurora 自动化上线风险会")}
                ${select("hostAgentId", "主持人", state.agents.map((a) => [a.id, a.name + " · " + a.title]), "agent-exec")}
                <label><span>参会 Agent</span><select name="participants" multiple size="5">${state.agents.map((a) => `<option value="${esc(a.id)}" selected>${esc(a.name)} · ${esc(a.department)}</option>`).join("")}</select></label>
                <button class="btn moss">开始讨论</button>
              </form>
            </div>
            <div class="panel">
              <h3 class="panel-title">${latest ? esc(latest.topic) : "会议纪要"}</h3>
              <p class="panel-desc">会议结论和待办任务会保存在本地会议记录。</p>
              ${latest ? meetingSummary(latest) : '<p class="muted">发起会议后，这里会显示各 Agent 发言。</p>'}
            </div>
          </section>
        `;
      }

      function meetingSummary(meeting) {
        return `
          <div class="stack">${meeting.messages
            .map(
              (msg) => `
            <div class="card" style="box-shadow:none"><strong>${esc(msg.speaker)}</strong><p class="muted">${esc(msg.content)}</p></div>`
            )
            .join("")}</div>
          <div class="card" style="margin-top:16px;background:var(--mint);box-shadow:none">
            <strong>会议结论</strong>
            <p>${esc(meeting.conclusion)}</p>
            <div class="list">${meeting.actionItems.map((item) => `<p>• ${esc(item)}</p>`).join("")}</div>
          </div>
        `;
      }

      function renderMemory() {
        return `
          ${pageHeader("Memory", "公司知识库", "保存公司记忆、客户档案、SOP、复盘记录，并为 Agent 提供可检索上下文。")}
          <section class="grid wide">
            <div class="panel">
              <h3 class="panel-title">知识录入</h3>
              <form class="form" id="memoryForm">
                ${input("title", "标题", "客户交付 SOP")}
                ${select("type", "类型", [["company", "company"], ["customer", "customer"], ["sop", "sop"], ["retrospective", "retrospective"], ["decision", "decision"]])}
                ${input("relatedClient", "相关客户", "可留空")}
                ${input("tags", "标签", "client, sop")}
                <label><span>知识内容</span><textarea name="content" required></textarea></label>
                <button class="btn moss">保存记忆</button>
              </form>
            </div>
            <div class="stack">${state.memories.map(memoryCard).join("")}</div>
          </section>
        `;
      }

      function memoryCard(memory) {
        return `
          <article class="panel">
            <div class="row" style="padding:0;border:0">
              <div><strong>${esc(memory.title)}</strong><p>${esc(memory.type)} · 更新于 ${esc(memory.updatedAt.slice(0, 10))}</p></div>
              ${memory.relatedClient ? `<span class="chip">${esc(memory.relatedClient)}</span>` : ""}
            </div>
            <p class="muted">${esc(memory.content)}</p>
            <div class="chips">${memory.tags.map((tag) => `<span class="chip">#${esc(tag)}</span>`).join("")}</div>
          </article>
        `;
      }

      function input(name, label, placeholder, value = "", type = "text") {
        return `<label><span>${label}</span><input type="${type}" name="${name}" value="${esc(value)}" placeholder="${esc(placeholder)}" required /></label>`;
      }

      function select(name, label, options, selected = "") {
        return `<label><span>${label}</span><select name="${name}">${options.map(([value, labelText]) => `<option value="${esc(value)}" ${value === selected ? "selected" : ""}>${esc(labelText)}</option>`).join("")}</select></label>`;
      }

      function bindView() {
        document.querySelectorAll(".approve").forEach((button) => button.addEventListener("click", () => decide(button.dataset.id, "approved")));
        document.querySelectorAll(".reject").forEach((button) => button.addEventListener("click", () => decide(button.dataset.id, "rejected")));
        document.getElementById("generateReport")?.addEventListener("click", generateReport);
        document.getElementById("fakeN8n")?.addEventListener("click", () => setStatus("n8n Webhook 已模拟触发"));
        document.getElementById("agentForm")?.addEventListener("submit", addAgent);
        document.getElementById("projectForm")?.addEventListener("submit", addProject);
        document.getElementById("taskForm")?.addEventListener("submit", addTask);
        document.getElementById("outputForm")?.addEventListener("submit", addOutput);
        document.getElementById("commandForm")?.addEventListener("submit", runCommand);
        document.getElementById("meetingForm")?.addEventListener("submit", runMeeting);
        document.getElementById("memoryForm")?.addEventListener("submit", addMemory);
      }

      function formData(form) {
        return Object.fromEntries(new FormData(form).entries());
      }

      function addAgent(event) {
        event.preventDefault();
        const data = formData(event.target);
        state.agents.unshift({
          id: id("agent"),
          name: data.name,
          department: data.department,
          title: data.title,
          managerId: "agent-exec",
          model: data.model,
          prompt: data.prompt,
          tools: String(data.tools).split(",").map((item) => item.trim()).filter(Boolean),
          status: data.status,
          currentFocus: "等待老板分配任务",
          successRate: 0
        });
        save();
        setStatus("Agent 已保存");
        render();
      }

      function addProject(event) {
        event.preventDefault();
        const data = formData(event.target);
        state.projects.unshift({
          id: id("project"),
          name: data.name,
          clientName: data.clientName,
          objective: data.objective,
          clientProfile: data.clientProfile,
          progress: Math.max(0, Math.min(100, Number(data.progress || 0))),
          stage: data.stage,
          agentIds: state.agents.slice(0, 3).map((agent) => agent.id),
          dueDate: data.dueDate
        });
        save();
        setStatus("项目已保存");
        render();
      }

      function addTask(event) {
        event.preventDefault();
        const data = formData(event.target);
        const risky = ["high", "critical"].includes(data.riskLevel);
        state.tasks.unshift({
          id: id("task"),
          title: data.title,
          description: data.description,
          assignedAgentId: data.assignedAgentId,
          projectId: data.projectId,
          priority: data.priority,
          riskLevel: data.riskLevel,
          dueAt: data.dueAt,
          status: "todo",
          approvalStatus: risky ? "pending" : "not_required",
          outputs: []
        });
        save();
        setStatus(risky ? "任务已保存，并进入审批" : "任务已保存");
        render();
      }

      function addOutput(event) {
        event.preventDefault();
        const data = formData(event.target);
        const task = state.tasks.find((item) => item.id === data.taskId);
        if (!task) return;
        task.outputs.push({ agentId: data.agentId, content: data.content, createdAt: new Date().toISOString() });
        task.status = "in_progress";
        state.selectedTaskId = task.id;
        save();
        setStatus("Agent 输出已写入任务记录");
        render();
      }

      function runCommand(event) {
        event.preventDefault();
        const goal = formData(event.target).goal;
        const drafts = [
          ["澄清目标与验收标准", "确认业务结果、完成标准、时间线和不可触碰边界。", "agent-exec", "medium"],
          ["制定执行路径与岗位分工", "拆成项目里程碑、任务依赖、负责人和日报检查点。", "agent-ops", "medium"],
          ["识别外部动作与审批风险", "检查客户承诺、合同条款、预算支出或自动化触发。", "agent-finance", "high"],
          ["生成对外沟通与增长素材", "输出客户沟通稿、内容方向或推广素材草案。", "agent-market", "low"]
        ];
        drafts.reverse().forEach(([title, desc, agentId, risk]) => {
          state.tasks.unshift({
            id: id("task"),
            title,
            description: `${desc} 目标：${goal}`,
            projectId: state.projects[0]?.id || "",
            assignedAgentId: agentId,
            priority: risk === "high" ? "high" : "medium",
            riskLevel: risk,
            dueAt: "",
            status: "todo",
            approvalStatus: risk === "high" ? "pending" : "not_required",
            outputs: []
          });
        });
        save();
        setStatus("执行经理已拆解并写入任务");
        render();
      }

      function runMeeting(event) {
        event.preventDefault();
        const data = formData(event.target);
        const participants = Array.from(event.target.elements.participants.selectedOptions).map((option) => option.value);
        const topic = data.topic;
        const messages = participants.map((agentId) => {
          const agent = state.agents.find((item) => item.id === agentId);
          return {
            speaker: `${agent?.name || agentId} · ${agent?.title || "Agent"}`,
            content: `围绕“${topic}”，建议先明确风险边界，再拆成可验收任务。`
          };
        });
        const actionItems = ["执行经理整理任务清单", "相关 Agent 补充岗位建议", "老板审批高风险事项"];
        state.meetings.unshift({
          id: id("meeting"),
          topic,
          hostAgentId: data.hostAgentId,
          participantAgentIds: participants,
          messages,
          conclusion: `围绕“${topic}”，优先推进低风险可执行事项；涉及客户承诺、预算或外部自动化的部分进入审批。`,
          actionItems,
          createdAt: new Date().toISOString()
        });
        save();
        setStatus("会议纪要已生成");
        render();
      }

      function addMemory(event) {
        event.preventDefault();
        const data = formData(event.target);
        state.memories.unshift({
          id: id("memory"),
          title: data.title,
          type: data.type,
          relatedClient: data.relatedClient,
          tags: String(data.tags).split(",").map((item) => item.trim()).filter(Boolean),
          content: data.content,
          updatedAt: new Date().toISOString()
        });
        save();
        setStatus("记忆已保存");
        render();
      }

      function decide(taskId, approvalStatus) {
        const task = state.tasks.find((item) => item.id === taskId);
        if (!task) return;
        task.approvalStatus = approvalStatus;
        task.status = approvalStatus === "approved" ? "in_progress" : "blocked";
        save();
        setStatus(approvalStatus === "approved" ? "任务已批准" : "任务已拒绝");
        render();
      }

      function generateReport() {
        const pending = state.tasks.filter((task) => task.approvalStatus === "pending");
        const blocked = state.tasks.filter((task) => task.status === "blocked");
        const done = state.tasks.filter((task) => task.status === "done");
        const busy = state.agents.filter((agent) => agent.status === "busy");
        state.report = {
          id: "report-" + today,
          reportDate: today,
          summary: `今日共跟进 ${state.tasks.length} 个任务、${state.projects.length} 个项目，当前有 ${pending.length} 个事项等待老板审批。`,
          wins: done.length ? done.map((task) => "完成：" + task.title) : ["完成经营数据同步", "新增任务与知识记录已沉淀"],
          risks: pending.map((task) => "待审批：" + task.title).concat(blocked.map((task) => "阻塞：" + task.title)).concat(busy.map((agent) => "员工负载偏高：" + agent.name)).slice(0, 5),
          nextActions: ["处理待审批高风险任务", "检查阻塞任务并重新分配负责人", "让执行经理 Agent 更新明日优先级"]
        };
        save();
        setStatus("今日日报已生成");
        render();
      }

      render();
    </script>
  </body>
</html>
